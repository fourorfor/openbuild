[package]
name = "openbuild-server"
version = "0.1.0"
edition.workspace = true
license = "Apache-2.0"
description = "ACP server that exposes an OpenBuild kernel to an external ACP client (Zed, Neovim, ...)"

[dependencies]
agent-client-protocol = { workspace = true, features = ["unstable"] }
openbuild-backend = { workspace = true }
xai-acp-lib = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true, features = ["compat"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tracing = { workspace = true }

[[bin]]
name = "openbuild-server"
path = "src/main.rs"

[lints]
workspace = true
