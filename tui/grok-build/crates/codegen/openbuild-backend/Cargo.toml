[package]
name = "openbuild-backend"
version = "0.1.0"
edition.workspace = true
license = "Apache-2.0"
description = "Backend adapter layer that lets the grok TUI talk to an ACP subprocess such as opencode"

[dependencies]
agent-client-protocol = { workspace = true, features = ["unstable"] }
xai-acp-lib = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true, features = ["compat"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tracing = { workspace = true }
# Optional HTTP/SSE side channel (`http_feed`).
base64 = { workspace = true }
reqwest = { workspace = true }

[lints]
workspace = true